<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inconsolata:wght@200..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Password generator app</title>
  </head>
  <body>
    <div class="main_container">
      <h1>Password Generator</h1>

      <!-- Password input container -->
      <div class="password_input_container">
        <form action="#" class="password_form">
          <input type="text" class="password_input" />
          <img
            class="CopyPaste_icon"
            src="assets/images/icon-copy.svg"
            alt="Copy password"
            title="Copy password"
          />
        </form>
      </div>

      <!-- Generate container -->
      <div class="GENERATE_container">
        <!-- character length container -->
        <div class="character_length_container">
          <label for="lengthRange">Character Length</label>
          <div class="length_value_wrapper">
            <p class="character_length_number">10</p>
          </div>
          <input type="range" id="lengthRange" min="0" max="25" value="10" />
        </div>
        <!-- radio buttons container -->
        <div class="radio_buttons_container">
          <form action="#">
            <div class="include_uppercase_letters">
              <input type="checkbox" checked />
              <label for="#">Include Uppercase Letters</label>
            </div>
            <div class="include_lowercase_letters">
              <input type="checkbox" checked />
              <label for="#">Include Lowercase Letters</label>
            </div>
            <div class="include_numbers">
              <input type="checkbox" checked />
              <label for="#">Include Numbers</label>
            </div>
            <div class="include_symbols">
              <input type="checkbox" />
              <label for="#">Include Sumbols</label>
            </div>
          </form>
        </div>

        <!-- STRENGTH-MEDIUM container -->

        <div class="strength_medium_container">
          <h3>STRENGTH</h3>

          <div class="SPAN_container">
            <h2>MEDIUM</h2>
            <div class="all_spans">
              <span class="span_1"></span>
              <span class="span_2"></span>
              <span class="span_3"></span>
              <span class="span_4"></span>
            </div>
          </div>
        </div>
        <!-- GENERATE button -->

        <div class="GENERATE">
          <p>GENERATE</p>
          <div class="generate_img">
            <img src="assets/images/icon-arrow-right.svg" alt="img" />
          </div>
        </div>
      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
